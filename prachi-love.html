<style>

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: #0a0010;
    font-family: 'Poppins', sans-serif;
    overflow-x: hidden;
    cursor: none;
  }

  /* Custom cursor */
  .cursor {
    width: 20px; height: 20px;
    background: radial-gradient(circle, #ff69b4, #ff1493);
    border-radius: 50%;
    position: fixed;
    pointer-events: none;
    z-index: 9999;
    transform: translate(-50%, -50%);
    transition: transform 0.1s;
    box-shadow: 0 0 20px #ff69b4, 0 0 40px #ff1493;
  }

  /* Animated background */
  .bg-gradient {
    position: fixed; inset: 0;
    background: linear-gradient(135deg, #0a0010 0%, #1a0030 25%, #0d001a 50%, #200040 75%, #0a0010 100%);
    background-size: 400% 400%;
    animation: bgShift 8s ease infinite;
    z-index: 0;
  }
  @keyframes bgShift {
    0%,100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }

  /* Floating particles */
  .particles { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
  .particle {
    position: absolute;
    border-radius: 50%;
    animation: floatUp linear infinite;
    opacity: 0;
  }
  @keyframes floatUp {
    0% { transform: translateY(100vh) scale(0) rotate(0deg); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 0.8; }
    100% { transform: translateY(-100px) scale(1.5) rotate(720deg); opacity: 0; }
  }
</style>

const canvas = document.getElementById('starCanvas');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });

const stars = Array.from({length: 200}, () => ({
  x: Math.random() * canvas.width,
  y: Math.random() * canvas.height,
  r: Math.random() * 2.5,
  a: Math.random(),
  speed: Math.random() * 0.02 + 0.005,
  color: ['#ff69b4','#ffb6c1','#ff1493','#fff','#ffd700'][Math.floor(Math.random()*5)]
}));

function drawStars() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  stars.forEach(s => {
    s.a += s.speed;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = s.color;
    ctx.globalAlpha = Math.abs(Math.sin(s.a));
    ctx.fill();
  });
  ctx.globalAlpha = 1;
  requestAnimationFrame(drawStars);
}
drawStars();

  `;

  @keyframes clickHeart {

    100% { transform: translate(var(--dx), var(--dy)) scale(1.5); opacity: 0; }
  }
`;
document.head.appendChild(clickStyle);

// Click anywhere hearts
document.addEventListener('click', e => {
  for (let i = 0; i < 5; i++) {
    const h = document.createElement('div');
    h.style.cssText = `
      position:fixed; left:${e.clientX}px; top:${e.clientY}px;
      font-size:${Math.random()*15+10}px; pointer-events:none; z-index:9999;
      animation: clickHeart 0.8s ease-out forwards;
      --dx:${(Math.random()-0.5)*100}px; --dy:${-(Math.random()*80+30)}px;
    `;
    h.textContent = '💖';
    document.body.appendChild(h);
    setTimeout(() => h.remove(), 800);
  }
});
</script>
</body>
</html>
